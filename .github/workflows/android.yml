name: Android Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-android:
    name: Android (${{ matrix.abi }}) APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            arch: android_arm64_v8a
            vcpkg_triplet: arm64-android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK r26
        run: |
          sdkmanager --install "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config python3 perl \
            libgl-dev libx11-dev libxext-dev \
            libxcb1-dev libx11-xcb-dev libxcb-glx0-dev \
            libxcb-util-dev libxcb-render-util0-dev \
            libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev \
            libxcb-shape0-dev libxcb-sync-dev \
            libxcb-xfixes0-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig-dev libfreetype-dev

      - name: Export vcpkg binary cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "${{ github.workspace }}/vcpkg"
          "${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $GITHUB_ENV
          echo "VCPKG_BINARY_SOURCES=clear;x-gha,readwrite" >> $GITHUB_ENV
          # x-gha uses GitHub Actions cache as a vcpkg binary cache, so Qt and other packages are
          # cached between runs and don't need to be rebuilt from source every time.

      - name: Install host Qt tools via vcpkg (required for moc/rcc cross-compilation)
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            "qtbase:x64-linux" \
            "qtshadertools:x64-linux" \
            "qtdeclarative:x64-linux" \
            "qtmultimedia:x64-linux"

      - name: Install Android Qt and dependencies via vcpkg
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            "qtbase:${{ matrix.vcpkg_triplet }}" \
            "qtshadertools:${{ matrix.vcpkg_triplet }}" \
            "qtdeclarative:${{ matrix.vcpkg_triplet }}" \
            "qtmultimedia:${{ matrix.vcpkg_triplet }}" \
            "ffmpeg[core,swscale,avdevice,avformat,avcodec,avutil]:${{ matrix.vcpkg_triplet }}" \
            "openssl:${{ matrix.vcpkg_triplet }}" \
            "spdlog:${{ matrix.vcpkg_triplet }}"

      - name: Configure CMake for Android
        run: |
          cmake -B build/android \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="${{ matrix.vcpkg_triplet }}" \
            -DVCPKG_HOST_TRIPLET="x64-linux" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM="android-26" \
            -DANDROID_STL="c++_shared" \
            -DQT_HOST_PATH="$VCPKG_ROOT/installed/x64-linux" \
            -DCMAKE_BUILD_TYPE=Release \
            -S .

      - name: Build shared library
        run: cmake --build build/android --parallel

      - name: Build APK
        run: cmake --build build/android --target apk

      - name: Get version
        id: version
        run: echo "version=$(cat VERSION | tr -d '\n\r')" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelBridge-android-${{ matrix.abi }}-v${{ steps.version.outputs.version }}
          path: build/android/android-build/build/outputs/apk/**/*.apk
