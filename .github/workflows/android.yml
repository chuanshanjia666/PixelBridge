name: Android Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-android:
    name: Android (${{ matrix.abi }}) APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            arch: android_arm64_v8a
            vcpkg_triplet: arm64-android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK r26
        run: |
          sdkmanager --install "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config

      - name: Install Qt for host (required for moc/rcc cross-compilation tools)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtmultimedia qtshadertools'
          dir: '${{ github.workspace }}/qt-host'
          set-env: false

      - name: Install Qt for Android (${{ matrix.abi }})
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'linux'
          target: 'android'
          arch: '${{ matrix.arch }}'
          modules: 'qtmultimedia qtshadertools'

      - name: Setup vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "${{ github.workspace }}/vcpkg"
          "${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $GITHUB_ENV

      - name: Install Android dependencies via vcpkg
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            "ffmpeg[core,swscale,avdevice,avformat,avcodec,avutil]:${{ matrix.vcpkg_triplet }}" \
            "openssl:${{ matrix.vcpkg_triplet }}" \
            "spdlog:${{ matrix.vcpkg_triplet }}"

      - name: Configure CMake for Android
        run: |
          HOST_QT_DIR="${{ github.workspace }}/qt-host/Qt/6.5.3/gcc_64"
          cmake -B build/android \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="${{ matrix.vcpkg_triplet }}" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM="android-26" \
            -DANDROID_STL="c++_shared" \
            -DQT_HOST_PATH="$HOST_QT_DIR" \
            -DCMAKE_PREFIX_PATH="$Qt6_DIR/../.." \
            -DCMAKE_BUILD_TYPE=Release \
            -S .

      - name: Build shared library
        run: cmake --build build/android --parallel

      - name: Build APK
        run: cmake --build build/android --target apk

      - name: Get version
        id: version
        run: echo "version=$(cat VERSION | tr -d '\n\r')" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelBridge-android-${{ matrix.abi }}-v${{ steps.version.outputs.version }}
          path: build/android/android-build/build/outputs/apk/**/*.apk
